# 1. JVM ヒープ及び GC 最適化 (4GB 割り当て & 低遅延並列GC / JDK は JAVA_HOME または各自の ~/.gradle/gradle.properties で指定)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 2. ビルドキャッシュ & 並列実行 & 設定キャッシュ
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 3. ファイルシステム監視 (UP-TO-DATE 高速判定)
org.gradle.vfs.watch=true

# 4. Kotlin インクリメンタルコンパイルの強化
kotlin.incremental=true

# 5. AndroidX & ビルド設定
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37
kotlin.code.style=official
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
