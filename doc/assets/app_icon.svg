<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景: クリーンなフラット・ディープスレート -->
  <rect width="512" height="512" rx="115" fill="#0F172A" />

  <!-- アンテナ (左) -->
  <line x1="220" y1="205" x2="185" y2="140" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <circle cx="185" cy="140" r="14" fill="#38BDF8" />

  <!-- アンテナ (右) -->
  <line x1="292" y1="205" x2="327" y2="140" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <circle cx="327" cy="140" r="14" fill="#38BDF8" />

  <!-- テレビモニター外枠 (角丸・シンプルフラット) -->
  <!-- x: 140..372 (幅 232, 高さ 176, r=42) -->
  <rect x="140" y="200" width="232" height="176" rx="42" fill="#1E293B" stroke="#007AFF" stroke-width="14" />

  <!-- スクリーン内部 -->
  <rect x="156" y="216" width="200" height="144" rx="30" fill="#0A0F1D" />

  <!-- ミニマル弾幕ライン -->
  <!-- 上段 -->
  <line x1="176" y1="250" x2="220" y2="250" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="305" y1="250" x2="336" y2="250" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- 下段 -->
  <line x1="176" y1="326" x2="200" y2="326" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="285" y1="326" x2="336" y2="326" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- 中央のフラット再生ボタン (ホワイト) -->
  <polygon points="242,260 290,288 242,316" fill="#FFFFFF" />
</svg>
